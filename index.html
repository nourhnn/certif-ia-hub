/h2><p>Explorez la démonstration du futur espace AMO, puis passez en profil Formateur pour découvrir l’expérience de l’autre côté.</p><button class="primary" onclick="go('staffing')">Découvrir le staffing assisté →</button></div><p class="footnote">Prototype de discussion basé sur le portail interne Certif-IA. Tous les noms d’entreprises, formateurs, événements, tarifs et indicateurs affichés sont fictifs.</p>`}
function formationsPage(){let rows=sessions.filter(s=>(state.filter==='all'||(state.filter==='open'?['À staffer','Staffing en cours'].includes(s.stage):s.stage===state.filter))&&(s.client+' '+s.title+' '+s.city).toLowerCase().includes(state.search.toLowerCase()));return `${intro('Les <em>formations.</em>','Un point d’entrée unique vers les informations clients, le staffing et la préparation.')}${filterBar('Rechercher une formation…',[['all','Tous les statuts'],['open','À staffer'],['Confirmée','Confirmées'],['Terminée','Terminées']])}<div class="table-wrap"><table class="tbl"><thead><tr><th>Client / Formation</th><th>Date</th><th>Localisation</th><th>Formateur</th><th>Statut</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr class="click-row" onclick="detail(${s.id})"><td><strong>${esc(s.client)}</strong><div class="item-sub">${esc(s.title)}</div></td><td>${esc(s.day)}<div class="item-sub">${esc(s.time)}</div></td><td>${esc(s.city)}</td><td>${s.trainer?esc(trById(s.trainer).name):'<span style="color:#b8afbd">Non attribué</span>'}</td><td>${badge(s.stage)}</td><td style="color:var(--purple);font-weight:800">Voir ↗</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">Aucune formation trouvée.</div>'}</div><p class="footnote">Dans une future version, les informations seraient rapprochées de HubSpot et de Google Agenda. Ici, elles sont entièrement simulées.</p>`}
function filterBar(placeholder,opts){return `<div class="toolbar"><div class="filters"><input class="field search" placeholder="${placeholder}" value="${esc(state.search)}" oninput="setSearch(this.value)"><select class="field" onchange="setFilter(this.value)">${opts.map(([v,l])=>`<option value="${v}" ${state.filter===v?'selected':''}>${l}</option>`).join('')}</select></div><span class="badge purple">Données fictives</span></div>`}function setSearch(v){state.search=v;let cursor=document.activeElement;let pos=cursor?.selectionStart;render();let i=document.querySelector('.field.search');if(i){i.focus();i.setSelectionRange(pos,pos)}}function setFilter(v){state.filter=v;render()}function detail(id){state.selectedSession=id;go('session-detail')}function staffFor(id){state.selectedSession=id;go('staffing')}
function trainersPage(){let rows=trainers.filter(t=>(state.filter==='all'||(state.filter==='available'?t.available:t.city===state.filter))&&(t.name+' '+t.skills.join(' ')+' '+t.city).toLowerCase().includes(state.search.toLowerCase()));return `${intro('Les <em>formateurs.</em>','Un annuaire enrichi avec leurs expertises, historiques et disponibilités indicatives.')}${filterBar('Nom, compétence ou ville…',[['all','Toutes les villes'],['available','Disponibles'],['Paris','Paris'],['Lyon','Lyon'],['Bordeaux','Bordeaux'],['Marseille','Marseille'],['Lille','Lille']])}<div class="trainer-grid">${rows.map(t=>`<div class="trainer-card"><div class="trainer-top"><div class="trainer-photo" style="background:${t.color};color:${t.accent}">${t.initials}</div><div><div class="trainer-name">${esc(t.name)}</div><div class="trainer-meta">⌖ ${esc(t.city)} · ${esc(t.rating)}</div></div></div><div class="tags">${t.skills.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>${badge(t.available?'Disponible':'Indisponible')}<div class="trainer-stats"><div><small>Missions passées</small><strong>${t.missions}</strong></div><div><small>Tarif indicatif / jour</small><strong>${t.rate} €</strong></div></div><div class="split-btns"><button class="secondary tiny" onclick="trainerDetailGo(${t.id})">Voir la fiche</button><button class="primary tiny" onclick="staffFor(102)">Proposer</button></div></div>`).join('')}</div><p class="footnote">Les catégories, tarifs et évaluations affichés sont des données de démonstration et non des informations réelles sur les formateurs Certif-IA.</p>`}function trainerDetailGo(id){state.selectedTrainer=id;go('trainer-detail')}
function trainerDetail(){let t=trById(state.selectedTrainer);return `<button class="ghost" onclick="go('trainers')">← Retour à l’annuaire</button><div style="height:13px"></div><div class="card"><div class="trainer-top"><div class="trainer-photo" style="width:70px;height:70px;font-size:24px;background:${t.color};color:${t.accent}">${t.initials}</div><div><h1 class="headline" style="font-size:29px;margin:0">${esc(t.name)}</h1><div class="trainer-meta">${esc(t.city)} · ${esc(t.rating)}</div></div><div class="grow"></div>${badge(t.available?'Disponible':'Indisponible')}</div><div class="tabs"><button class="selected">Présentation</button><button onclick="go('planning')">Planning</button></div><div class="info-grid"><div class="info"><small>Expertises</small><strong>${t.skills.join(' · ')}</strong></div><div class="info"><small>Tarif indicatif</small><strong>${t.rate} € / jour</strong></div><div class="info"><small>Formations passées</small><strong>${t.missions}</strong></div><div class="info"><small>Disponibilités Google</small><strong>Simulation uniquement</strong></div></div><h3 class="section-title" style="margin-top:25px">Exemples d’interventions</h3>${t.history.map(x=>`<div class="line-item">◷ &nbsp; ${esc(x)} <span class="grow"></span>${badge('Historique fictif')}</div>`).join('')}<div class="toolbar"><button class="primary" onclick="staffFor(102)">Proposer une mission →</button></div></div>`}
function planningPage(){let hours=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00'];let ev={'0-0':['Groupe Atlas','Formation Certif-IA','purple'],'2-1':['RDV externe','Indisponibilité privée','red'],'4-2':['Studio Nova','Option formation','amber'],'1-3':['Atelier Cobalt','Formation Certif-IA','green'],'3-5':['Mission externe','Indisponibilité','red'],'0-6':['Maison Oria','Staffing en cours','amber']};return `${intro('Planning <em>global.</em>','Une lecture commune des formations Certif-IA, options et disponibilités personnelles.') }<div class="toolbar"><div class="group"><button class="secondary" onclick="toast('Semaine précédente simulée')">‹</button><span style="font-weight:800">Semaine du 9 au 13 novembre 2026</span><button class="secondary" onclick="toast('Semaine suivante simulée')">›</button></div><button class="primary" onclick="openModal('calendar')">+ Ajouter une option</button></div><div class="legend"><span><i class="dot"></i>Formation Certif-IA</span><span><i class="dot green"></i>Formation confirmée</span><span><i class="dot amber"></i>Option en attente</span><span><i class="dot red"></i>Indisponibilité privée ou externe</span></div><div class="calendar"><div class="cal-head"><div>Heure</div>${['Lun. 09','Mar. 10','Mer. 11','Jeu. 12','Ven. 13'].map(d=>`<div>${d}</div>`).join('')}</div>${hours.map((h,i)=>`<div class="cal-row"><div class="cal-time">${h}</div>${[0,1,2,3,4].map(j=>{let x=ev[j+'-'+i];return `<div class="cal-cell">${x?`<div class="event ${x[2]}">${x[0]}<small>${x[1]}</small></div>`:''}</div>`}).join('')}</div>`).join('')}</div><p class="footnote">Exemple d'affichage fictif. Une intégration réelle rapprocherait les événements professionnels de l’agenda Certif-IA et les périodes occupées partagées par les formateurs. Les intitulés privés ne seraient pas visibles.</p>`}
function staffingPage(){let s=sessById(state.selectedSession);let scored=trainers.map(t=>({t,score:Math.max(58,Math.min(98,70+(t.skills.some(k=>s.topic.toLowerCase().includes(k.toLowerCase())||k.toLowerCase().includes(s.topic.toLowerCase()))?17:0)+(t.available?9:-14)+(t.city===s.city?4:0)))})).sort((a,b)=>b.score-a.score);return `${intro('Staffing <em>assisté.</em>','Comparer les profils, préparer une proposition et suivre la confirmation.')}<div class="toolbar"><div class="group"><span style="font-weight:700">Formation à staffer</span><select class="field" onchange="state.selectedSession=Number(this.value);state.candidate=null;render()">${sessions.filter(x=>x.stage!=='Terminée').map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.client)} — ${esc(x.day)}</option>`).join('')}</select></div>${badge(s.stage)}</div><div class="detail-grid"><div><div class="card"><div class="card-head"><div><h3 class="section-title">Formateurs suggérés</h3><p class="section-caption">Scores illustratifs — aucune IA connectée.</p></div></div>${scored.slice(0,4).map(({t,score})=>`<div class="candidate ${state.candidate===t.id?'selected':''}"><div class="trainer-photo" style="background:${t.color};color:${t.accent};width:44px;height:44px">${t.initials}</div><div class="grow"><div class="item-title">${esc(t.name)}</div><div class="item-sub">${esc(t.city)} · ${t.rate} €/jour · ${esc(t.skills.slice(0,2).join(', '))}</div><div style="margin-top:7px">${badge(t.available?'Disponible':'À vérifier')}</div></div><div class="candidate-score">${score}%<small>adéquation*</small></div><button class="${state.candidate===t.id?'primary':'secondary'} tiny" onclick="pickCandidate(${t.id})">${state.candidate===t.id?'Sélectionné':'Choisir'}</button></div>`).join('')}<p class="footnote">*Scores calculés uniquement pour illustrer la comparaison. Dans la version réelle, il faudra définir et valider les critères avec les AMO.</p></div></div><div><div class="card"><h3 class="section-title">Mission sélectionnée</h3><div class="mini-heading">Client</div><strong>${esc(s.client)}</strong><div class="mini-heading">Formation</div><strong>${esc(s.title)}</strong><div class="mini-heading">Détails</div><div class="item-sub">📍 ${esc(s.city)}<br>🗓 ${esc(s.day)} · ${esc(s.time)}<br>♧ ${s.people} participants</div><div class="mini-heading">Formateur choisi</div><div style="font-weight:800">${state.candidate?esc(trById(state.candidate).name):'Aucun pour le moment'}</div><button class="primary" style="width:100%;margin-top:18px;${!state.candidate?'opacity:.45;':''}" ${!state.candidate?'disabled':''} onclick="openModal('whatsapp')">Préparer le WhatsApp ↗</button><button class="secondary" style="width:100%;margin-top:9px" onclick="detail(${s.id})">Voir la fiche formation</button></div></div></div>`}function pickCandidate(id){state.candidate=id;render()}
function sessionDetail(){let s=sessById(state.selectedSession);return `<button class="ghost" onclick="go('formations')">← Retour aux formations</button>${intro(esc(s.client),esc(s.title),'FICHE FORMATION · EXEMPLE FICTIF')}<div class="toolbar"><div class="group">${badge(s.stage)}<span class="badge blue">HubSpot simulé</span><span class="badge purple">Google Agenda simulé</span></div><button class="primary" onclick="staffFor(${s.id})">${s.trainer?'Changer / comparer':'Trouver un formateur'} →</button></div><div class="detail-grid"><div><div class="card"><div class="card-head"><div><h3 class="section-title">Informations de la session</h3><p class="section-caption">Données regroupées depuis les outils métier (simulation).</p></div></div><div class="info-grid"><div class="info"><small>Date de formation</small><strong>${esc(s.day)} 2026</strong></div><div class="info"><small>Horaires</small><strong>${esc(s.time)}</strong></div><div class="info"><small>Lieu</small><strong>${esc(s.city)}</strong></div><div class="info"><small>Participants</small><strong>${s.people} personnes</strong></div><div class="info"><small>Formateur affecté</small><strong>${s.trainer?esc(trById(s.trainer).name):'À confirmer'}</strong></div><div class="info"><small>Statut</small><strong>${esc(s.stage)}</strong></div></div><h3 class="section-title" style="margin:28px 0 10px">Cycle de préparation</h3><div class="flow-steps">${['Audit','Cadrage','Programme J-7','Formation','Typeform','Bilan'].map((x,i)=>`<span class="flow-step ${i<2?'done':i===2?'current':''}">${x}</span>`).join('')}</div></div><div class="card" style="margin-top:18px"><h3 class="section-title">Documents & livrables</h3><p class="section-caption">Emplacement cible : ${esc(s.drive)}</p>${docRows(s.id)}<button class="secondary" style="margin-top:15px" onclick="go('documents')">Voir tous les livrables</button></div></div><div><div class="card"><h3 class="section-title">Sources et suivis</h3>${[['HubSpot','Données client et transaction'],['Google Agenda','Invitation et horaires'],['Google Drive','Audit, programme, supports, bilans'],['Typeform','Évaluations et NPS']].map(([a,b])=>`<div class="line-item"><div class="grow"><div class="item-title">${a}</div><div class="item-sub">${b}</div></div><span class="badge">Simulation</span></div>`).join('')}</div><div class="card" style="margin-top:18px"><h3 class="section-title">Actions rapides</h3><div class="stack" style="margin-top:14px"><button class="secondary" onclick="openModal('invite')">✉ Préparer une invitation</button><button class="secondary" onclick="openModal('note')">＋ Ajouter une note interne</button><button class="secondary" onclick="go('insights')">▤ Suivi et bilans</button></div></div></div></div>`}
function docRows(id){return [['audit','Audit client','AUDIT'],['programme','Programme de formation','PROGRAMME'],['support','Supports pédagogiques','SUPPORT'],['questionnaire','Questionnaire fin de session','BILANS'],['bilan','Bilan de formation','BILANS']].map(([key,label,folder])=>`<div class="doc-row"><span class="doc-icon">▤</span><div class="grow"><div class="item-title">${label}</div><div class="item-sub">${folder} · ${state.uploaded[id+'-'+key]||'Aucun dépôt simulé'}</div></div>${badge(state.uploaded[id+'-'+key]?'Déposé':state.checked[key]?'Validé':'À déposer')}<button class="ghost" onclick="openModal('document','${id}:${key}')">${state.uploaded[id+'-'+key]?'Voir':'Déposer'} ↗</button></div>`).join('')}
function documentsPage(){return `${intro('Suivi des <em>livrables.</em>','Documents, échéances et validation, reliés à chaque formation.') }<div class="cards" style="grid-template-columns:repeat(3,1fr)">${metric('À déposer','3','● Avant les formations')}${metric('En validation','2','● Vérification AMO')}${metric('Validés','7','✓ Exemples fictifs')}</div><div class="card" style="margin-top:20px"><div class="card-head"><div><h3 class="section-title">Livrables des formations</h3><p class="section-caption">Simulez le dépôt ou la validation d'un document.</p></div></div>${sessions.slice(0,4).map(s=>`<div class="line-item"><div class="datebox"><strong>${s.date.slice(8)}</strong><small>nov.</small></div><div class="grow"><div class="item-title">${esc(s.client)} — ${esc(s.title)}</div><div class="item-sub">Programme · Dossier ${esc(s.drive)}</div></div>${badge(state.uploaded[s.id+'-programme']?'Déposé':'À déposer')}<button class="secondary tiny" onclick="openModal('document','${s.id}:programme')">Déposer ↗</button></div>`).join('')}</div>`}
function insightsPage(){return `${intro('Suivi & <em>bilans.</em>','Des indicateurs utiles pour piloter les formations et améliorer l’expérience.') }<div class="cards">${metric('Sessions terminées','1','Exemple fictif')}${metric('NPS moyen','9/10','Évaluation fictive')}${metric('Bilans finalisés','1','Exemple fictif')}${metric('Retours à traiter','2','Action à suivre')}</div><div class="two-col"><div class="card"><h3 class="section-title">Parcours de fin de formation</h3><div class="flow-steps">${['Formation terminée','QR code Typeform','Réponses participants','NPS client','Bilan AMO'].map((x,i)=>`<span class="flow-step ${i===0?'done':i===1?'current':''}">${x}</span>`).join('')}</div><p style="color:#807987;line-height:1.6">La future plateforme pourrait centraliser le suivi des réponses, les relances et les documents de bilan, sans remplacer Typeform.</p></div><div class="card"><h3 class="section-title">À retenir</h3><div class="notif">Les évaluations restent dans Typeform : Certif-IA Hub offrirait une lecture centralisée de leur avancement.</div><div class="notif">Les données de satisfaction doivent respecter les autorisations d’accès.</div></div></div>`}
function trainerHome(){return `${intro('Bonjour <em>Laurent.</em>','Retrouvez vos missions, vos documents et vos prochaines échéances.','ESPACE FORMATEUR · DONNÉES FICTIVES')}<div class="banner"><h2>Vos formations, au même endroit.</h2><p>Un espace dédié aux missions Certif-IA, aux documents à transmettre et à la gestion des disponibilités.</p><button class="primary" onclick="go('trainer-missions')">Mes missions →</button></div><div class="cards" style="margin-top:20px">${metric('Missions confirmées','2','À venir')}${metric('Propositions reçues','1','À examiner')}${metric('Documents en attente','1','Programme J-7')}${metric('Agenda personnel','Non relié','Connexion simulable')}</div><div class="two-col"><div class="card"><h3 class="section-title">Prochaines missions</h3>${sessions.filter(s=>s.trainer===1).map(s=>`<div class="line-item"><div class="datebox"><strong>${s.date.slice(8)}</strong><small>${s.date.slice(5,7)==='10'?'oct.':'nov.'}</small></div><div class="grow"><div class="item-title">${esc(s.client)}</div><div class="item-sub">${esc(s.title)} · ${esc(s.city)}</div></div>${badge(s.stage)}</div>`).join('')}</div><div class="card"><h3 class="section-title">À faire</h3><div class="task" style="margin-top:16px"><span class="bubble">📄</span><div class="grow"><strong>Déposer le programme</strong><p>Groupe Atlas · dossier PROGRAMME</p></div><button class="ghost" onclick="go('trainer-docs')">↗</button></div><div class="task" style="margin-top:9px"><span class="bubble">🗓</span><div class="grow"><strong>Connecter Google Agenda</strong><p>Afficher uniquement vos disponibilités</p></div><button class="ghost" onclick="go('trainer-calendar')">↗</button></div></div></div>`}
function trainerMissions(){return `${intro('Mes <em>missions.</em>','Consultez vos formations et gérez vos réponses aux propositions.','ESPACE FORMATEUR')}<div class="card"><div class="card-head"><h3 class="section-title">Proposition de formation</h3>${badge(state.trainerResponse[102]||'En attente')}</div><div class="info-grid"><div class="info"><small>Client</small><strong>Studio Nova</strong></div><div class="info"><small>Date et lieu</small><strong>16 novembre · Lyon</strong></div><div class="info"><small>Thématique</small><strong>Claude pour la création</strong></div><div class="info"><small>Format</small><strong>Présentiel · 9h30–17h30</strong></div></div><div class="toolbar"><div class="group"><button class="primary" onclick="respond('Acceptée')">✓ Je suis disponible</button><button class="secondary" onclick="respond('Refusée')">✕ Je ne suis pas disponible</button></div></div></div><div class="card" style="margin-top:18px"><h3 class="section-title">Missions de démonstration</h3>${sessions.filter(s=>s.trainer===1).map(s=>`<div class="line-item"><div class="datebox"><strong>${s.date.slice(8)}</strong><small>${s.date.slice(5,7)==='10'?'oct.':'nov.'}</small></div><div class="grow"><div class="item-title">${esc(s.client)}</div><div class="item-sub">${esc(s.title)}</div></div>${badge(s.stage)}<button class="ghost" onclick="detailTrainerSession(${s.id})">Détails ↗</button></div>`).join('')}</div>`}function respond(status){state.trainerResponse[102]=status;render();toast('Réponse '+status.toLowerCase()+' (simulation)')}function detailTrainerSession(id){state.selectedSession=id;go('trainer-docs')}
function trainerCalendar(){return `${intro('Mon <em>agenda.</em>','Votre planning Certif-IA et vos indisponibilités personnelles, sans dévoiler les détails privés.','ESPACE FORMATEUR')}<div class="card" style="margin-bottom:18px"><div class="card-head"><div><h3 class="section-title">Connexion Google Agenda</h3><p class="section-caption">Cette maquette ne sollicite aucun accès à votre compte.</p></div>${badge(state.googleConnected?'Connexion simulée':'Non connecté')}</div><button class="primary" onclick="state.googleConnected=!state.googleConnected;render();toast('État de connexion modifié (simulation)')">${state.googleConnected?'Déconnecter la simulation':'Simuler la connexion Google'}</button></div>${planningPage().split('<div class="toolbar">')[1]?`<div class="legend"><span><i class="dot green"></i>Formation Certif-IA</span><span><i class="dot red"></i>Indisponibilité personnelle</span></div><div class="card"><h3 class="section-title">Exemple de disponibilités</h3>${[['12 novembre · 09h–17h','Formation Certif-IA','green'],['13 novembre · 09h–12h','Indisponible (privé)','red'],['16 novembre · 09h30–17h30','Mission proposée','amber'],['17 novembre · journée','Disponible','green']].map(([a,b,c])=>`<div class="line-item"><div class="grow"><strong>${a}</strong></div><span class="badge ${c}">${b}</span></div>`).join('')}</div>`:''}`}
function trainerDocs(){return `${intro('Mes <em>livrables.</em>','Déposez vos documents depuis cet espace. Dans la version réelle, ils seraient classés automatiquement sur Google Drive.','ESPACE FORMATEUR')}<div class="card"><div class="card-head"><div><h3 class="section-title">Groupe Atlas — Formation IA générative</h3><p class="section-caption">Session du 12 novembre · Paris</p></div>${badge('Confirmée')}</div>${docRows(101)}</div><div class="notif" style="margin-top:18px">🔒 Démonstration : les fichiers sélectionnés restent sur votre ordinateur. Aucun envoi vers Google Drive ni aucun serveur n'est effectué.</div>`}
function modalView(){let m=state.modal,s=sessById(state.selectedSession),t=trById(state.candidate||1);if(m.kind==='whatsapp'){let message=`Hello ${t.name.split(' ')[0]} 👋\n\n⚡️ J'ai une nouvelle mission à te proposer.\n\nClient : ${s.client}\nDates : ${s.day} 2026, ${s.time}\nLieu : ${s.city}\nFormat : Présentiel\nSpécialisation : ${s.topic}\n\nSerais-tu disponible à cette date ? J'attends ton retour !`;return modalBox('Proposition WhatsApp','Message prérempli. Aucun message n’est envoyé automatiquement.',`<textarea class="field" id="message" spellcheck="false">${esc(message)}</textarea><div class="modal-actions"><button class="secondary" onclick="closeModal()">Fermer</button><button class="primary" onclick="copyMessage()">Copier le message</button></div>`)}if(m.kind==='document'){let [id,key]=String(m.id).split(':'),name=({audit:'Audit',programme:'Programme',support:'Support',questionnaire:'Questionnaire',bilan:'Bilan'})[key];return modalBox('Déposer un document','Démonstration sans transfert réel vers Google Drive.',`<div class="info"><small>Livrable ciblé</small><strong>${esc(name)} · ${esc(sessById(id)?.client)}</strong></div><p>Dans la version réelle, ce document serait envoyé dans le dossier ${esc(({audit:'AUDIT',programme:'PROGRAMME',support:'SUPPORT',questionnaire:'BILANS',bilan:'BILANS'})[key])} correspondant au client.</p><input type="file" class="field" id="upload-file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xlsx,.png,.jpg"><div class="modal-actions"><button class="secondary" onclick="closeModal()">Annuler</button><button class="primary" onclick="fakeUpload('${id}','${key}')">Simuler le dépôt</button></div>`)}if(m.kind==='calendar')return modalBox('Nouvelle option de planning','Créer un bloc de démonstration (aucune synchronisation).',`<input class="field" id="new-title" placeholder="Nom de la mission"><input class="field" type="date" value="2026-11-18"><div class="modal-actions"><button class="secondary" onclick="closeModal()">Annuler</button><button class="primary" onclick="closeModal();toast('Option créée (simulation)')">Créer l’option</button></div>`);return modalBox(m.kind==='invite'?'Invitation Google Agenda':'Note interne','Simulation : aucune donnée ne quitte cette page.',`<textarea class="field" placeholder="${m.kind==='invite'?'Éléments de l’invitation…':'Votre note…'}"></textarea><div class="modal-actions"><button class="secondary" onclick="closeModal()">Fermer</button><button class="primary" onclick="closeModal();toast('Action simulée')">Enregistrer</button></div>`)}
function modalBox(title,sub,content){return `<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2><p>${sub}</p>${content}</div></div>`}function copyMessage(){let x=$('message').value;navigator.clipboard?.writeText(x).then(()=>toast('Message copié')).catch(()=>fallbackCopy(x));if(!navigator.clipboard)fallbackCopy(x)}function fallbackCopy(x){let t=$('message');t.select();document.execCommand('copy');toast('Message copié')}function fakeUpload(id,key){let file=$('upload-file').files[0];if(!file){toast('Sélectionnez un document pour la simulation');return}state.uploaded[id+'-'+key]=file.name;closeModal();toast('Dépôt simulé : '+file.name)}
render();
</script></body></html>
